openapi: 3.0.0
servers:
  - description: Cluster Endpoint
    url: /api
info:
  description: Specialist appointment booking management for Web-In-Cloud system
  version: '1.0.0'
  title: Specialist Booking API
  contact:
    email: xdrga@stuba.sk
  license:
    name: CC BY 4.0
    url: 'https://creativecommons.org/licenses/by/4.0/'
tags:
  - name: specialistBooking
    description: Specialist appointment booking API
paths:
  '/specialist-booking/{clinicId}/appointments':
    get:
      tags: [specialistBooking]
      summary: Provides appointments for selected clinic
      operationId: getAppointments
      parameters:
        - $ref: '#/components/parameters/ClinicId'
      responses:
        '200':
          description: value of appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Appointment'
              examples:
                response:
                  $ref: '#/components/examples/AppointmentsExample'
        '404':
          description: Clinic with such ID does not exist
    post:
      tags: [specialistBooking]
      summary: Creates appointment in selected clinic
      operationId: createAppointment
      parameters:
        - $ref: '#/components/parameters/ClinicId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Appointment'
      responses:
        '201':
          description: created appointment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '400':
          description: Invalid appointment input
  '/specialist-booking/{clinicId}/appointments/{appointmentId}':
    get:
      tags: [specialistBooking]
      summary: Provides appointment detail
      operationId: getAppointment
      parameters:
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        '200':
          description: appointment detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '404':
          description: Appointment with such ID does not exist
    put:
      tags: [specialistBooking]
      summary: Updates appointment
      operationId: updateAppointment
      parameters:
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/AppointmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Appointment'
      responses:
        '200':
          description: updated appointment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '404':
          description: Appointment with such ID does not exist
    delete:
      tags: [specialistBooking]
      summary: Cancels appointment
      operationId: deleteAppointment
      parameters:
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        '204':
          description: appointment cancelled
        '404':
          description: Appointment with such ID does not exist
  '/specialist-booking/{clinicId}/time-slots':
    get:
      tags: [specialistBooking]
      summary: Provides available time slots for selected clinic
      operationId: getTimeSlots
      parameters:
        - $ref: '#/components/parameters/ClinicId'
      responses:
        '200':
          description: value of time slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeSlot'
              examples:
                response:
                  $ref: '#/components/examples/TimeSlotsExample'
        '404':
          description: Clinic with such ID does not exist
    post:
      tags: [specialistBooking]
      summary: Creates time slot for selected clinic
      operationId: createTimeSlot
      parameters:
        - $ref: '#/components/parameters/ClinicId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeSlot'
      responses:
        '201':
          description: created time slot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeSlot'
        '400':
          description: Invalid time slot input
  '/specialist-booking/{clinicId}/time-slots/{slotId}':
    get:
      tags: [specialistBooking]
      summary: Provides time slot detail
      operationId: getTimeSlot
      parameters:
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/SlotId'
      responses:
        '200':
          description: time slot detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeSlot'
        '404':
          description: Time slot with such ID does not exist
    put:
      tags: [specialistBooking]
      summary: Updates time slot
      operationId: updateTimeSlot
      parameters:
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/SlotId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeSlot'
      responses:
        '200':
          description: updated time slot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeSlot'
        '404':
          description: Time slot with such ID does not exist
    delete:
      tags: [specialistBooking]
      summary: Deletes time slot
      operationId: deleteTimeSlot
      parameters:
        - $ref: '#/components/parameters/ClinicId'
        - $ref: '#/components/parameters/SlotId'
      responses:
        '204':
          description: time slot deleted
        '404':
          description: Time slot with such ID does not exist
components:
  parameters:
    ClinicId:
      in: path
      name: clinicId
      description: id of the specialist clinic
      required: true
      schema:
        type: string
    AppointmentId:
      in: path
      name: appointmentId
      description: id of appointment
      required: true
      schema:
        type: string
    SlotId:
      in: path
      name: slotId
      description: id of time slot
      required: true
      schema:
        type: string
  schemas:
    Appointment:
      type: object
      required: [id, patientId, patientName, startsAt, durationMinutes, examinationType, status]
      properties:
        id:
          type: string
          example: apt-001
        patientId:
          type: string
          example: 460527-jozef-pucik
        patientName:
          type: string
          example: Jožko Púčik
        patientEmail:
          type: string
          format: email
          example: pacient@example.com
        referringDoctor:
          type: string
          example: MUDr. Kováč
        startsAt:
          type: string
          format: date-time
          example: '2038-12-24T10:35:00Z'
        durationMinutes:
          type: integer
          format: int32
          example: 30
        examinationType:
          type: string
          example: Kardiologické vyšetrenie
        status:
          type: string
          example: confirmed
        note:
          type: string
          example: Kontrola po zákroku
    TimeSlot:
      type: object
      required: [id, startsAt, durationMinutes, capacity, booked, examinationType, urgentBlocked]
      properties:
        id:
          type: string
          example: slot-001
        startsAt:
          type: string
          format: date-time
          example: '2038-12-24T11:00:00Z'
        durationMinutes:
          type: integer
          format: int32
          example: 30
        capacity:
          type: integer
          format: int32
          example: 2
        booked:
          type: integer
          format: int32
          example: 1
        examinationType:
          type: string
          example: Neurologická konzultácia
        urgentBlocked:
          type: boolean
          example: false
  examples:
    AppointmentsExample:
      value:
        - id: apt-001
          patientId: 460527-jozef-pucik
          patientName: Jožko Púčik
          patientEmail: pacient@example.com
          startsAt: '2038-12-24T10:35:00.000Z'
          durationMinutes: 30
          examinationType: Kardiologické vyšetrenie
          status: confirmed
        - id: apt-002
          patientId: 780907-ferdinand-tre
          patientName: Ferdinand Trety
          patientEmail: druhy@example.com
          startsAt: '2038-12-24T11:20:00.000Z'
          durationMinutes: 45
          examinationType: Neurologická konzultácia
          status: requested
    TimeSlotsExample:
      value:
        - id: slot-001
          startsAt: '2038-12-24T11:00:00.000Z'
          durationMinutes: 30
          capacity: 2
          booked: 1
          examinationType: Neurologická konzultácia
          urgentBlocked: false
        - id: slot-002
          startsAt: '2038-12-24T12:00:00.000Z'
          durationMinutes: 30
          capacity: 1
          booked: 0
          examinationType: Dermatologická kontrola
          urgentBlocked: true
